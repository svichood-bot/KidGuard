name: Build KidGuard APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project zip
        run: |
          if [ ! -f KidGuard-updated.zip ]; then
            echo "ERROR: KidGuard-updated.zip is not in the repo. Files found:"
            ls -la
            exit 1
          fi
          mkdir -p project
          unzip -oq KidGuard-updated.zip -d project || [ $? -eq 1 ]
          echo "Unpacked:"
          ls -la project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KidGuard-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
