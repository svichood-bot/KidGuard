name: Build KidGuard APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip KidGuard.zip
      - name: Add nudity model
        run: |
          mkdir -p KidGuard/app/src/main/assets
          cp nsfw.tflite KidGuard/app/src/main/assets/nsfw.tflite
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: KidGuard
      - uses: actions/upload-artifact@v4
        with:
          name: KidGuard-apk
          path: KidGuard/app/build/outputs/apk/debug/app-debug.apk
