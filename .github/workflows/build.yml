name: Build KidGuard APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project zip
        run: |
          ZIP=KidGuard.zip
          [ -f "$ZIP" ] || ZIP=$(ls *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then
            echo "::error::No zip file found in the repo. Files here: $(ls | tr '\n' ' ')"
            exit 1
          fi
          echo "Using zip: $ZIP"
          mkdir -p project
          unzip -oq "$ZIP" -d project
          rc=$?
          if [ $rc -gt 1 ]; then
            echo "::error::Could not unzip $ZIP (code $rc). The upload may be incomplete or damaged."
            exit 1
          fi
          SETTINGS=$(find project -maxdepth 3 -name settings.gradle.kts | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Unzipped OK but no settings.gradle.kts inside. Top level of zip: $(ls project | tr '\n' ' ')"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -E "^e: |What went wrong|error:" -A2 build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            exit $rc
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: KidGuard-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
